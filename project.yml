# XcodeGen spec. Run `xcodegen generate` (on a Mac or in CI) to produce FrontierMap.xcodeproj.
name: FrontierMap
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.5.0
targets:
  FrontierMap:
    type: application
    platform: iOS
    sources:
      - Sources
      # Kokoro voice model and sherpa-onnx are fetched by CI (ios.yml), not committed: too big for git.
      - path: Kokoro
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - framework: Frameworks/SherpaOnnxC.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.frontiermap
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Frontier Map
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        MAPTILER_KEY: $(MAPTILER_KEY)
        NSLocationWhenInUseUsageDescription: Shows where you are on the map and how far your waypoints are.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  FrontierMapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FrontierMap
schemes:
  FrontierMap:
    build:
      targets:
        FrontierMap: all
    test:
      targets: [FrontierMapTests]
