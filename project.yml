# XcodeGen spec. Run `xcodegen generate` (on a Mac or in CI) to produce FrontierMap.xcodeproj.
name: FrontierMap
options:
  bundleIdPrefix: com.frontiermap
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.5.0
targets:
  FrontierMap:
    type: application
    platform: iOS
    sources:
      - Sources
      # Kokoro voice model and sherpa-onnx are fetched by CI (ios.yml), not committed: too big for git.
      - path: Kokoro
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - framework: Frameworks/SherpaOnnxC.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FRONTIER_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Frontier Map
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        MAPTILER_KEY: $(MAPTILER_KEY)
        NSLocationWhenInUseUsageDescription: Shows where you are on the map and how far your waypoints are.
        NSMicrophoneUsageDescription: Lets you ask the guide out loud, so you can keep your hands on the wheel.
        NSSpeechRecognitionUsageDescription: Turns what you say to the guide into a trip request, on the phone where it can.
        # Turn-by-turn keeps talking with the screen locked.
        UIBackgroundModes: [location, audio]
        # Parchment (dark paper in dark mode), the same as the app, so launch fades into the map instead of flashing white.
        UILaunchScreen: { UIColorName: LaunchBackground }
        UIAppFonts: [CHINESER.TTF]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  FrontierMapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FrontierMap
schemes:
  FrontierMap:
    build:
      targets:
        FrontierMap: all
    test:
      targets: [FrontierMapTests]
