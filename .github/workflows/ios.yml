# Builds and tests on a GitHub-hosted Mac (so it also works if you only have Windows).
# The built app contains your MapTiler key, so builds and drive logs are only uploaded when the repo is private.
name: iOS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (26+ lets the trip assistant use Apple's on-device model)
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - run: brew install xcodegen
      - name: Write key from repo secret
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: echo "MAPTILER_KEY = $MAPTILER_KEY" > Config/Secrets.xcconfig
      - name: Fetch Kokoro voice model and sherpa-onnx (Apache-2.0)
        run: |
          base=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -fsSL -o sherpa.zip $base/xcframework/sherpa-onnx-v1.13.8-ios-shared-onnxruntime-static.xcframework.zip
          mkdir -p Frameworks && unzip -q sherpa.zip -d Frameworks
          curl -fsSL $base/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2 | tar xj
          mkdir Kokoro && cd kokoro-int8-multi-lang-v1_0
          mv model.int8.onnx voices.bin tokens.txt lexicon-us-en.txt espeak-ng-data LICENSE ../Kokoro/
          # Drifter's deep baritone (user's pick, sample 5): 70% am_onyx + 30% bm_george into unused slot 53 (em_santa).
          python3 ../scripts/blend_voice.py ../Kokoro/voices.bin 53 17:0.7 26:0.3
      - run: xcodegen generate
      - name: Unit tests (simulator)
        run: |
          xcodebuild test -project FrontierMap.xcodeproj -scheme FrontierMap \
            -destination "platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | xargs)"
      - name: Simulator build (for Appetize.io or a Mac's simulator)
        run: |
          xcodebuild -project FrontierMap.xcodeproj -scheme FrontierMap -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build
          cd build/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/FrontierMap-simulator.zip" FrontierMap.app
      - name: Simulated drive (screenshots + every spoken line, for review)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]*\([0-9A-F-]{36}\)' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/FrontierMap.app
          xcrun simctl privacy "$udid" grant location com.zoelucifer.frontiermap
          # Indiranagar, Bengaluru, to Domlur: a short city drive with a few turns.
          xcrun simctl location "$udid" set 12.9716,77.6412
          mkdir -p drive
          # The app drives itself at 10 m/s from -from to -demo (DemoLocation in MapView.swift).
          xcrun simctl launch --console-pty "$udid" com.zoelucifer.frontiermap -from 12.9716,77.6412 -demo 12.9611,77.6387 > drive/app.log 2>&1 &
          for i in $(seq 1 45); do grep -q DEMO_STARTED drive/app.log && break; sleep 2; done
          xcrun simctl io "$udid" screenshot drive/00-start.png
          for i in $(seq -w 1 30); do sleep 7; xcrun simctl io "$udid" screenshot drive/$i.png; done
          grep -a "SAY:" drive/app.log || true
      - uses: actions/upload-artifact@v4
        if: always() && github.event.repository.private
        with:
          name: FrontierMap-drive
          path: drive
          retention-days: 7
      - name: Unsigned device IPA (sign with Sideloadly on Windows, private repos only)
        run: |
          xcodebuild -project FrontierMap.xcodeproj -scheme FrontierMap -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/FrontierMap.app Payload/
          zip -r FrontierMap-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private
        with:
          name: FrontierMap-builds
          path: |
            FrontierMap-simulator.zip
            FrontierMap-unsigned.ipa
          retention-days: 7
